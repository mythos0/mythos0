<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mythos0 animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="180" y1="60" x2="960" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <style>
      .title {
        font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .subtitle {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-weight: 600;
      }
      .pulse {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .float {
        animation: float 8s ease-in-out infinite;
      }
      .blink {
        animation: blink 1s steps(1) infinite;
      }
      .lineMove {
        stroke-dasharray: 16 18;
        animation: lineMove 8s linear infinite;
      }
      @keyframes pulse {
        0%,100% { opacity: .5; transform: scale(1); }
        50% { opacity: .9; transform: scale(1.08); }
      }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes blink {
        0%,49% { opacity: 1; }
        50%,100% { opacity: 0; }
      }
      @keyframes lineMove {
        to { stroke-dashoffset: -400; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g class="pulse" filter="url(#soft)">
    <circle cx="210" cy="90" r="56" fill="#58A6FF" opacity="0.45"/>
    <circle cx="950" cy="230" r="62" fill="#A371F7" opacity="0.4"/>
    <circle cx="1080" cy="70" r="38" fill="#2EA043" opacity="0.35"/>
  </g>

  <path class="lineMove" d="M90 248 C260 180, 430 294, 610 230 S930 170, 1110 212" stroke="url(#glow)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <g class="float">
    <text x="90" y="145" fill="#F0F6FC" font-size="64" class="title">mythos0</text>
    <text x="90" y="195" fill="#58A6FF" font-size="26" class="subtitle">Flutter • Mobile Architecture • Product Craft</text>
    <text x="90" y="240" fill="#7EE787" font-size="24" class="subtitle">$ build --beautiful --fast --scalable</text>
    <rect x="566" y="220" width="14" height="24" rx="2" fill="#7EE787" class="blink"/>
  </g>
</svg>
